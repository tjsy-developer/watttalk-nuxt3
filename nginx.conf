server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # This location block handles all requests to /watttalk and its sub-paths.
    location /watttalk {
        # The 'alias' directive maps the /watttalk URL path to the /usr/share/nginx/html directory.
        # This is the key change.
        alias /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Always prevent caching for index.html, regardless of the path.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}